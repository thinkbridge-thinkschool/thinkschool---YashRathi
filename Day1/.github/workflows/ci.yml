name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Piece_4_GodMethodRefactor/OrderRefactorApi/OrderRefactorApi.csproj
      - name: Build
        run: dotnet build Piece_4_GodMethodRefactor/OrderRefactorApi/OrderRefactorApi.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test Piece_4_GodMethodRefactor/OrderRefactorApi.Tests/OrderRefactorApi.Tests.csproj --configuration Release --verbosity normal
