name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Day3/piece17_CI_pipeline/QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Build
        run: dotnet build Day3/piece17_CI_pipeline/QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore

      - name: Run integration tests
        run: dotnet test Day3/piece17_CI_pipeline/QuotesApi.Tests/QuotesApi.Tests.csproj --no-build --verbosity normal

      - name: Restore unit tests (piece19)
        run: dotnet restore Day3/piece19_xUnit/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj

      - name: Build unit tests (piece19)
        run: dotnet build Day3/piece19_xUnit/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-restore

      - name: Run unit tests (piece19)
        run: dotnet test Day3/piece19_xUnit/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-build --verbosity normal

      - name: Pull SQL Server 2022 image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Restore piece21 Testcontainers integration tests
        run: dotnet restore Day3/piece21_Docker/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Build piece21 Testcontainers integration tests
        run: dotnet build Day3/piece21_Docker/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-restore

      - name: Run piece21 Testcontainers integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test Day3/piece21_Docker/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-build --verbosity normal

      - name: Restore piece21 unit tests
        run: dotnet restore Day3/piece21_Docker/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj

      - name: Build piece21 unit tests
        run: dotnet build Day3/piece21_Docker/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-restore

      - name: Run piece21 unit tests
        run: dotnet test Day3/piece21_Docker/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-build --verbosity normal

      - name: Restore piece21 SQLite integration tests
        run: dotnet restore Day3/piece21_Docker/QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Build piece21 SQLite integration tests
        run: dotnet build Day3/piece21_Docker/QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore

      - name: Run piece21 SQLite integration tests
        run: dotnet test Day3/piece21_Docker/QuotesApi.Tests/QuotesApi.Tests.csproj --no-build --verbosity normal

  piece22-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Day4/piece22_WireCI/QuotesApi.slnx

      - name: Build
        run: dotnet build Day4/piece22_WireCI/QuotesApi.slnx --no-restore

      - name: Pull SQL Server 2022 image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Test
        run: dotnet test Day4/piece22_WireCI/QuotesApi.slnx --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings Day4/piece22_WireCI/coverlet.runsettings --results-directory Day4/piece22_WireCI/TestResults
        env:
          RYUK_DISABLED: "true"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece22-test-results
          path: Day4/piece22_WireCI/TestResults/**/*.trx

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece22-coverage-reports
          path: Day4/piece22_WireCI/TestResults/**/coverage.cobertura.xml

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Check coverage threshold
        run: |
          reportgenerator \
            "-reports:Day4/piece22_WireCI/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:Day4/piece22_WireCI/CoverageReport" \
            "-reporttypes:JsonSummary"

          python3 - <<'EOF'
          import json, sys
          with open("Day4/piece22_WireCI/CoverageReport/Summary.json") as f:
              data = json.load(f)
          cov = data["summary"]["linecoverage"]
          print(f"Line coverage: {cov:.1f}%")
          if cov < 70:
              print(f"FAIL: {cov:.1f}% is below the required 70% threshold.")
              sys.exit(1)
          print(f"PASS: {cov:.1f}% >= 70% — threshold met.")
          EOF

  piece23-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Day4/piece23/QuotesApi.slnx

      - name: Build
        run: dotnet build Day4/piece23/QuotesApi.slnx --no-restore

      - name: Pull SQL Server 2022 image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Test with coverage
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          dotnet test Day4/piece23/QuotesApi.slnx \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings Day4/piece23/coverlet.runsettings \
            --results-directory Day4/piece23/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece23-test-results
          path: Day4/piece23/TestResults/**/*.trx

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece23-coverage-reports
          path: Day4/piece23/TestResults/**/coverage.cobertura.xml

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Check coverage ≥ 80%
        run: |
          reportgenerator \
            "-reports:Day4/piece23/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:Day4/piece23/CoverageReport" \
            "-reporttypes:JsonSummary"

          python3 - <<'EOF'
          import json, sys
          with open("Day4/piece23/CoverageReport/Summary.json") as f:
              data = json.load(f)
          cov = data["summary"]["linecoverage"]
          print(f"Line coverage: {cov:.1f}%")
          if cov < 80:
              print(f"FAIL: {cov:.1f}% is below the required 80% threshold.")
              sys.exit(1)
          print(f"PASS: {cov:.1f}% >= 80% — threshold met.")
          EOF
